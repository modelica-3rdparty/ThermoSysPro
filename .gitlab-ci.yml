# This is the GitLab CI/CD configuration file to test ThermoSysPro on an internal VM (PAM).
# This script works once it is mirrored on the internal (pleiade) gitlab, so that it can
# exchange with the internal VM. 
# 
# The objectives of this pipeline are:
# - Test ThermoSysPro examples on Dymola (done)
# - Test extra models (additional gitlab project)
# - Test ThermoSysPro on other tools (OpenModelica)
# - Evaluate changes on some realistic studies (calibration, optimisation, 
# uncertainties propagations...)
# - Publish ThermoSysPro on GitHub:
#   - Remove confidential modules (based on a "database" file)
#   - Publish the public version on GitHub
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#

workflow:
  rules:
    - if: $CI_PROJECT_NAME == "ThermoSysPro_mirror"

variables:
  basePath: C:\Users\j74082\Documents\Modeli\CI_CD\OpenModelicaLibraryTesting
  conf_OM: $basePath\configs\conf_TSP_mirror_slash.json
  OM_omc_binPath: C:\\Program Files\\OpenModelica1.23.1-64bit\\bin

stages:          # List of stages for jobs, and their order of execution
  - simulate
  - report
#  - deploy

simulate-job:       # This job runs in the build stage, which runs first.
  stage: simulate
  script:
    - echo $CI_PROJECT_NAME
    - echo $CI_PROJECT_PATH
    - echo $CI_PROJECT_URL
    #- git clone https://gitlab.pleiade.edf.fr/Phy13Models/modelicalibraries/devtest_thermosyspro.git
    - dir
    - conda env list
    - echo "$env:PATH"
    - $env:PATH="$env:PATH;"+$OM_omc_binPath
    - echo "$env:PATH"
    - bash -c "'omc'" 
    
  #for reduced examples (easier tests), try with "C:\Users\j74082\Documents\Modeli\CI_CD\OpenModelicaLibraryTesting\configs\test_conf.json" instead of "C:\Users\j74082\Documents\Modeli\CI_CD\OpenModelicaLibraryTesting\configs\conf_TSP_mirror_slash.json"

    - conda run --no-capture-output -n env_CICD_m python "$basePath\test_MAZU_chdir.py" $conf_OM --noclean --basePath $basePath
    

report-job:       # This job runs in the build stage, which runs first.
  stage: report
  script:    
    - conda run --no-capture-output -n env_CICD_m python "$basePath\report_MAZU_chdir.py" $conf_OM --basePath $basePath
    - cp $basePath\ThermoSysPro.html ".\"
    - cp $basePath\sqlite3.db ".\"
    - cp -r $basePath\files ".\"
    - rm $basePath\sqlite3.db
  artifacts:
    name: "$env:CI_JOB_STAGE-$env:CI_COMMIT_REF_NAME"
    paths:
      - ThermoSysPro.html
      - sqlite3.db
      - files/