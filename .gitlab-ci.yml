stages:
  - test
  - build
  - deploy

# Smoke-test that the Docker image contains enough Python and OpenModelica
# tooling to read the Modelica annotations used to generate the book.
documentation-environment:
  stage: test
  image: openmodelica/openmodelica:v1.23.1-ompython
  script:
    # GitLab Docker jobs run as root by default. OpenModelica refuses to start
    # its ZMQ server as root, and omc4py needs that server, so use ciuser.
    - useradd --create-home --shell /bin/bash ciuser
    - chown -R ciuser:ciuser "$CI_PROJECT_DIR"
    - omc --version
    - python3 --version
    - python3 -m pip install -r .documentation/requirements.txt
    - python3 -c "import yaml, tqdm; print('Python documentation dependencies are available')"
    - su ciuser -c "test -f ThermoSysPro/package.mo"
    - su ciuser -c "python3 -c 'import omc4py; omc = omc4py.open_session(); print(omc.getVersion()); assert omc.loadFile(\"ThermoSysPro/package.mo\"); classes = omc.getClassNames(\"ThermoSysPro\"); print(\"Loaded ThermoSysPro with\", len(classes), \"top-level classes\"); omc.close()'"

# Generate Markdown from the Modelica annotations, then build the Jupyter Book.
jupyter-build:
  stage: build
  image: openmodelica/openmodelica:v1.23.1-ompython
  script:
    # The documentation generator opens an omc4py session, so it must also run
    # as a non-root user for the same OpenModelica ZMQ security reason.
    - useradd --create-home --shell /bin/bash ciuser
    - chown -R ciuser:ciuser "$CI_PROJECT_DIR"
    - python3 -m pip install -r .documentation/requirements.txt
    - su ciuser -c "cd .documentation && python3 mo_to_book.py"
    - su ciuser -c "cd .documentation && jupyter-book clean ."
    - su ciuser -c "cd .documentation && jupyter-book build ."
  artifacts:
    paths:
      - .documentation/_build/

# GitLab Pages serves files from a top-level public/ directory.
pages:
  stage: deploy
  image: busybox:latest
  script:
    - mv .documentation/_build/html public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
